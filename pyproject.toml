[project]
name = "oto-runner"
version = "0.1.0"
description = "Le worker externe des runs hébergés oto — un client pur : API de fil, face MCP, clé de modèle"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# ⚠️ ÉPINGLÉ À L'ÉGAL, pas au minimum. La roue embarque le CLI Claude Code, et
# c'est le CLI qui décide de la liste d'outils réellement servie : la garantie
# « aucun outil intégré hors la délégation » a été MESURÉE sur un couple précis,
# SDK 0.2.153 ↔ CLI 2.1.273 (`claude_agent_sdk/_cli_version.py`). Un `>=` laissait
# un `pip install` de routine changer le CLI sous la garantie, sans rien dire.
# Relever la version = remesurer la liste d'outils, puis réécrire ce commentaire.
claude-code = ["claude-agent-sdk==0.2.153"]
dev = ["pytest>=8.0"]

[project.scripts]
oto-runner = "oto_runner.worker:main"
oto-fleet = "oto_runner.fleet:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oto_runner"]

[tool.pytest.ini_options]
# La racine sur le sys.path de la collecte : un module de test en importe un
# autre (`from tests.…`), et sans ça la collecte s'interrompt AVANT le premier
# test — la CI était rouge depuis le 19/08 sans qu'aucune vérification tourne.
pythonpath = ["."]

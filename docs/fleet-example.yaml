# Une FLOTTE : la déclaration complète d'une campagne d'agents sur une file
# de travail datastore. Un fichier par flotte — jamais un secret ici : le
# jeton oto (OTO_TOKEN) et la clé de modèle viennent de l'environnement.
#
# Lancer : python -m oto_runner.fleet flotte.yaml
# Le modèle vient de l'env du WORKER (OTO_RUNNER_MODEL) — un champ `model`
# ici serait logué puis ignoré : le pool de workers est homogène.
# Le NOM DU FICHIER sans son extension est le nom de la flotte : il est apposé
# à chaque job (`fleet`), et c'est par lui qu'on retrouve une campagne.

procedure: enrichissement-fiche   # la procédure (doctrine) que chaque run déroule
namespace: prospects-demo         # la file : le tableau datastore à drainer
filter: {statut: a_traiter}       # ce qui reste à traiter (borne + comptage)
project: 42                       # le contexte de chaque appel (_project)

tools:                            # l'allowlist du run — fail-closed côté worker
  - data_claim_next
  - data_write
  - fr_get
  - serper_search

concurrency: 3                    # jobs en vol au maximum
ramp_seconds: 60                  # montée en charge : un départ par minute au plus
volume: épuisement                # ou un entier : plafond TOTAL de lignes
budget_tokens: 5000000            # cap de sécurité — la flotte s'arrête PROPREMENT
max_steps: 40                     # tours de modèle par run ; le run se ré-enfile
                                  # via la flotte tant que la file n'est pas vide

# Le RENDEMENT : ce que la campagne PRODUIT rapporté à ce qu'elle coûte. Sans
# `jetons_par_ecriture_max`, la borne est inactive.
jetons_par_ecriture_max: 40000    # plafond de jetons par écriture, sur la fenêtre
rendement_fenetre: 10             # fenêtre glissante de jobs conclus (défaut 10) ;
                                  # tant qu'elle n'est pas pleine, aucun verdict

# Le BILAN : il retombe à cette cadence pendant le vol, et une fois à la fin.
# Il se pose à côté de cette déclaration, en JSON : `<ce fichier>.bilan.json`.
bilan_periode_s: 600              # cadence du bilan intermédiaire (défaut 600 s)
org: 7                            # l'org de la MISSION : le tableau y vit, et le
                                  # journal des appels aussi — sans elle, le poste
                                  # « refus d'écriture » du bilan est omis

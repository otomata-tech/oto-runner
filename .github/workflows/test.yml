name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # le plancher déclaré — on teste la version la plus vieille
      - run: pip install -e .[dev]
      - run: pytest -q
